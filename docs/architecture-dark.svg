<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
  </defs>

  <rect width="880" height="340" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1"/>

  <!-- Pipeline Top Flow Line -->
  <line x1="160" y1="80" x2="720" y2="80" stroke="#30363d" stroke-dasharray="4 4" stroke-width="2"/>

  <!-- Stage 1 -->
  <g transform="translate(40, 40)">
    <rect width="220" height="180" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1"/>
    <rect width="220" height="4" rx="2" fill="url(#blueGrad)"/>
    <text x="20" y="32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#58a6ff">STAGE 1: TERMINAL</text>
    <text x="20" y="58" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Core Reductions</text>
    <text x="20" y="86" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">• ANSI Sequence Stripping</text>
    <text x="20" y="108" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">• Command Delta (Cross-Turn)</text>
    <text x="20" y="130" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">• Error Rail Guard (Preserved)</text>
    <text x="20" y="152" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">• Head / Tail Windowing</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(300, 40)">
    <rect width="220" height="180" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1"/>
    <rect width="220" height="4" rx="2" fill="url(#accentGrad)"/>
    <text x="20" y="32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#3fb950">STAGE 2: TOOL RESULTS</text>
    <text x="20" y="58" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Cross-Turn Dedup</text>
    <text x="20" y="86" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">• Scoped Search Grouping</text>
    <text x="20" y="108" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">• Turn-Aware Pointer Fold</text>
    <text x="20" y="130" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">• Search Path Collapsing</text>
    <text x="20" y="152" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">• JSON Minify + TOON</text>
  </g>

  <!-- Stage 3 / CCR -->
  <g transform="translate(560, 40)">
    <rect width="280" height="180" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1"/>
    <rect width="280" height="4" rx="2" fill="#d29922"/>
    <text x="20" y="32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e3b341">SAFETY RAIL: CCR</text>
    <text x="20" y="58" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Content-Addressed Store</text>
    <text x="20" y="86" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">• 12-char SHA-256 Hashing</text>
    <text x="20" y="108" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">• Exact O(1) Local Disk Lookup</text>
    <text x="20" y="130" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">• On-demand Retrieval Tool</text>
    <text x="20" y="152" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">• Automatic LRU &amp; TTL Eviction</text>
  </g>

  <!-- Bottom Metric Banner -->
  <g transform="translate(40, 250)">
    <rect width="800" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="40" y="36" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8b949e">PERFORMANCE PROFILE</text>
    <text x="240" y="36" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#3fb950">~1.0 ms</text>
    <text x="300" y="36" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">Terminal Hook</text>
    <text x="430" y="36" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#3fb950">&lt; 0.1 ms</text>
    <text x="500" y="36" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">Repeat Passthrough</text>
    <text x="630" y="36" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#3fb950">0</text>
    <text x="650" y="36" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">External Dependencies</text>
  </g>
</svg>
