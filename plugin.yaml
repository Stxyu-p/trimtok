name: trimtok
version: 5.5.5
description: "Local context compressor: per-command budgets, balanced windowing, error rails, Drain templates, shingle near-dedup, HEAD_TAIL stubs, cross-turn fold, command/tool exclusions, two-tier SQLite CCR with short #ref aliases and section retrieval (errors/diff/summary/tail), scoped search grouping, lossless TOON v2 hierarchical columnar JSON tables, cross-turn fuzzy delta engine (STILL FAILING / +added / -removed), structured traceback & semantic diff pruner, fail-open guard (guard_ms, default 200)."
entry_point: __init__.py
author: "P Choke & MIKA"
provides_hooks:
  - transform_terminal_output
  - transform_tool_result
  - post_llm_call
  - on_session_start
  - on_session_end
provides_tools:
  - trimtok_retrieve
config_schema:
  enabled:
    type: bool
    default: true
    description: Master switch for all hooks (fail-open; false = passthrough).
  guard_ms:
    type: float
    default: 200
    description: Fail-open deadline budget in ms (1-1000); hooks return the original text when exceeded. 200 covers the observed p99 (63ms) and worst real case (145ms); at 50 every payload over ~9K tokens timed out and saved nothing.
  phase2_enabled:
    type: bool
    default: true
    description: transform_tool_result switch (cross-turn fold).
  mask_enabled:
    type: bool
    default: true
    description: post_llm_call fold-index expiry (turn freshness mask).
  mask_keep_turns:
    type: int
    default: 2
    description: Fold-index keeps content from this many recent turns.
  audit_enabled:
    type: bool
    default: true
    description: Record compression savings to audit.jsonl log.
  usage_enabled:
    type: bool
    default: true
    description: Record every hook invocation (all gates + retrieves) to usage.jsonl for long-horizon use-case data.
  toon_enabled:
    type: bool
    default: true
    description: Lossless JSON to TOON columnar tables (round-trip verified; folds only when >=4 BPE tokens are saved).
  toon_mode:
    type: str
    default: auto
    description: "Model-aware TOON gate: auto = TOON for families with a track record on columnar text, minified JSON otherwise; always = always TOON; never = always minified JSON."
  model_family:
    type: str
    default: ""
    description: Target model family (e.g. claude, gpt, qwen). Empty means "unknown" and keeps TOON enabled so nothing regresses silently.
  policy_enabled:
    type: bool
    default: true
    description: Content policy — secrets, security-policy files and patch payloads stay byte-exact instead of being compressed.
  context_pressure:
    type: float
    default: 0.0
    description: Fraction of the context window already used (0..1). Drives adaptive compression — <0.35 keeps more lines (light), >0.75 folds harder (aggressive). Hooks may pass it per call.
  adaptive_enabled:
    type: bool
    default: true
    description: Let context_pressure scale the line budget and fold threshold. Disable to pin the level to normal.
  delta_enabled:
    type: bool
    default: true
    description: Cross-turn delta for repeated terminal commands (STILL FAILING / +added / -removed vs previous run).
  delta_threshold:
    type: float
    default: 0.65
    description: Similarity gate for command deltas (plan kill-criteria - raise to 0.80 if retrieves exceed ~15% of turns).
  min_chars:
    type: int
    default: 2048
    description: Minimum output size before compression kicks in.
  exclude_commands:
    type: list
    default: []
    description: Normalized command prefixes that bypass terminal-output compression.
  exclude_tools:
    type: list
    default: []
    description: Exact Hermes tool names that bypass tool-result compression.
  max_lines:
    type: int
    default: 120
    description: Default line budget for terminal output.
  ccr_max_entries:
    type: int
    default: 1000
    description: Maximum cached original files in CCR store.
  ccr_max_bytes:
    type: int
    default: 52428800
    description: Maximum byte cap for CCR storage (default 50MB).
  ccr_ttl_hours:
    type: int
    default: 24
    description: Hours before cached original files expire.
