name: trimtok
version: 3.0.0
description: "Local context compressor: per-command budgets, balanced windowing, error rails, Drain templates, shingle near-dedup, HEAD_TAIL stubs, cross-turn fold, command/tool exclusions, two-tier SQLite CCR with short #ref aliases and section retrieval (errors/diff/summary/tail), scoped search grouping, lossless TOON v2 hierarchical columnar JSON tables, cross-turn fuzzy delta engine (STILL FAILING / +added / -removed), structured traceback & semantic diff pruner, fail-open guard (guard_ms, default 50)."
entry_point: __init__.py
author: "P Choke & MIKA"
provides_hooks:
  - transform_terminal_output
  - transform_tool_result
  - post_llm_call
  - on_session_start
  - on_session_end
provides_tools:
  - trimtok_retrieve
config_schema:
  enabled:
    type: bool
    default: true
    description: Master switch for all hooks (fail-open; false = passthrough).
  guard_ms:
    type: float
    default: 50
    description: Fail-open deadline budget in ms (1-1000); hooks return the original text when exceeded. Safety ceiling — set 8.5 for the strict plan profile.
  phase2_enabled:
    type: bool
    default: true
    description: transform_tool_result switch (cross-turn fold).
  mask_enabled:
    type: bool
    default: true
    description: post_llm_call fold-index expiry (turn freshness mask).
  mask_keep_turns:
    type: int
    default: 2
    description: Fold-index keeps content from this many recent turns.
  audit_enabled:
    type: bool
    default: true
    description: Record compression savings to audit.jsonl log.
  usage_enabled:
    type: bool
    default: true
    description: Record every hook invocation (all gates + retrieves) to usage.jsonl for long-horizon use-case data.
  toon_enabled:
    type: bool
    default: true
    description: Lossless JSON to TOON columnar tables (round-trip verified; folds only when >=4 BPE tokens are saved).
  delta_enabled:
    type: bool
    default: true
    description: Cross-turn delta for repeated terminal commands (STILL FAILING / +added / -removed vs previous run).
  delta_threshold:
    type: float
    default: 0.65
    description: Similarity gate for command deltas (plan kill-criteria - raise to 0.80 if retrieves exceed ~15% of turns).
  min_chars:
    type: int
    default: 2048
    description: Minimum output size before compression kicks in.
  exclude_commands:
    type: list
    default: []
    description: Normalized command prefixes that bypass terminal-output compression.
  exclude_tools:
    type: list
    default: []
    description: Exact Hermes tool names that bypass tool-result compression.
  max_lines:
    type: int
    default: 120
    description: Default line budget for terminal output.
  ccr_max_entries:
    type: int
    default: 1000
    description: Maximum cached original files in CCR store.
  ccr_max_bytes:
    type: int
    default: 52428800
    description: Maximum byte cap for CCR storage (default 50MB).
  ccr_ttl_hours:
    type: int
    default: 24
    description: Hours before cached original files expire.
